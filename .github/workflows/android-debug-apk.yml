name: Android Debug APK

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Release APK (Fast)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build optimized Release APK
        run: flutter build apk --release --split-per-abi

      - name: Sign Release APK for direct install
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/zipalign" -f -p 4 \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/linthra-fast-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks ~/.android/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out build/app/outputs/flutter-apk/linthra-fast-release.apk \
            build/app/outputs/flutter-apk/linthra-fast-aligned.apk

      - name: Upload fast Release APK
        uses: actions/upload-artifact@v7
        with:
          name: linthra-fast-release-apk
          path: build/app/outputs/flutter-apk/linthra-fast-release.apk
          if-no-files-found: error
          
